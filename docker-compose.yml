# Ghost Server on the Asustor NAS.
# Data (database, documents) lives in /volume1/Docker/ghost-server — back that folder up.
services:
  ghost-server:
    image: ghcr.io/persian86/ghost-server:latest
    # build: .
    container_name: ghost-server
    restart: unless-stopped
    # Host networking: the container uses the NAS's own network. Asustor's default
    # Docker bridge often has no route to the internet ("Network is unreachable").
    # Ghost Server listens on port 8780 directly (8000/8001 = ADM, 8123 = Home Assistant).
    network_mode: host
    environment:
      - TZ=Australia/Melbourne
      - GHOST_DATA=/data
      - GHOST_PORT=8780
    volumes:
      - /volume1/Docker/ghost-server:/data
      # The tablet's photo frame: point this at your photos (read-only). Change the left side to your share.
      - /volume1/Photos:/photos:ro
