# ─────────────────────────────────────────────────────────────────────────────
#  Ghost room screen: Waveshare ESP32-S3-Touch-LCD-4B (4" 480×480, mics + speaker)
#
#  A Home Assistant voice satellite with on-device wake word and a small Ghost screen
#  (clock, weather, assistant status, light buttons). Pick the "Ghost" voice assistant
#  for it in Home Assistant, and Ghost answers every request, knowing which room it is in.
#
#  Don't flash this file directly. Flash a room file (bedroom.yaml …) that includes it.
#  Pins come from Waveshare's schematic-checked pin audit (hardware/pin-audit.md in
#  github.com/waveshareteam/ESP32-S3-Touch-LCD-4B).
# ─────────────────────────────────────────────────────────────────────────────
substitutions:
  name: ghost-room
  friendly_name: Ghost Room
  room: Room
  wake_word: hey_jarvis            # hey_jarvis | okay_nabu | hey_mycroft
  wake_word_name: Hey Jarvis       # what the screen tells you to say
  weather_entity: weather.home
  light_1: light.room_light
  light_1_name: Light
  light_2: light.room_lamp
  light_2_name: Lamp
  light_3: fan.room_fan
  light_3_name: Fan

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.10.0
  on_boot:
    priority: 600
    then:
      - switch.turn_on: speaker_amp
      - light.turn_on:
          id: backlight
          brightness: 80%

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  on_client_connected:
    - if:
        condition: {switch.is_off: mute}
        then:
          - micro_wake_word.start:
  on_client_disconnected:
    - voice_assistant.stop:
    - micro_wake_word.stop:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${friendly_name} setup

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

# ── buses & the I/O expander ─────────────────────────────────────────────────
i2c:
  - id: bus_a
    sda: GPIO47
    scl: GPIO48
    frequency: 400kHz

pca9554:                      # TCA9554 (register compatible)
  - id: exp
    i2c_id: bus_a
    address: 0x20

# The ST7701 panel's 3-wire setup bus runs through the expander (EXIO0 CS, EXIO1 data, EXIO2 clock)
spi:
  - id: lcd_spi
    interface: software
    clk_pin: {pca9554: exp, number: 2}
    mosi_pin: {pca9554: exp, number: 1}

# ── screen ───────────────────────────────────────────────────────────────────
display:
  - platform: mipi_rgb
    id: screen
    model: ST7701S
    spi_id: lcd_spi
    cs_pin: {pca9554: exp, number: 0}
    reset_pin: {pca9554: exp, number: 7}
    dimensions:
      width: 480
      height: 480
    pixel_mode: 16bit
    color_order: RGB
    pclk_frequency: 12MHz
    pclk_inverted: false
    de_pin: GPIO17
    hsync_pin: GPIO46
    vsync_pin: GPIO3
    pclk_pin: GPIO9
    hsync_front_porch: 10
    hsync_pulse_width: 8
    hsync_back_porch: 50
    vsync_front_porch: 10
    vsync_pulse_width: 8
    vsync_back_porch: 20
    data_pins:                # LSB → MSB. If red and blue look swapped, set color_order: BGR
      red: [GPIO10, GPIO11, GPIO12, GPIO13, GPIO14]
      green: [GPIO21, GPIO8, GPIO18, GPIO45, GPIO38, GPIO39]
      blue: [GPIO40, GPIO41, GPIO42, GPIO2, GPIO1]
    auto_clear_enabled: false
    update_interval: never

output:
  - platform: ledc
    id: backlight_pwm
    pin: GPIO4
    frequency: 20kHz

light:
  - platform: monochromatic
    id: backlight
    name: Screen
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 400ms

touchscreen:
  - platform: gt911
    id: touch
    i2c_id: bus_a
    display: screen
    reset_pin: {pca9554: exp, number: 5}
    on_touch:
      - light.turn_on: {id: backlight, brightness: 80%}

# ── audio: ES8311 speaker codec + ES7210 microphones on one I2S bus ─────────
i2s_audio:
  - id: i2s_bus
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO16
    i2s_mclk_pin: GPIO5

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: bus_a
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000

audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bus_a
    address: 0x40
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 30dB

switch:
  - platform: gpio
    id: speaker_amp
    name: Speaker amplifier
    entity_category: config
    pin: {pca9554: exp, number: 3}
    restore_mode: ALWAYS_ON
  - platform: template
    id: mute
    name: Mute microphone
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - voice_assistant.stop:
      - micro_wake_word.stop:
      - script.execute: {id: show_phase, phase: "muted"}
    on_turn_off:
      - micro_wake_word.start:
      - script.execute: {id: show_phase, phase: "idle"}

microphone:
  - platform: i2s_audio
    id: va_mic
    i2s_audio_id: i2s_bus
    adc_type: external
    i2s_din_pin: GPIO15
    pdm: false
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: left

speaker:
  - platform: i2s_audio
    id: i2s_spk
    i2s_audio_id: i2s_bus
    dac_type: external
    i2s_dout_pin: GPIO6
    audio_dac: es8311_dac
    sample_rate: 16000
    bits_per_sample: 16bit
    channel: mono
    buffer_duration: 100ms
  - platform: mixer
    id: mixer_spk
    output_speaker: i2s_spk
    num_channels: 1
    source_speakers:
      - id: announce_mix
      - id: media_mix
  - platform: resampler
    id: announce_spk
    output_speaker: announce_mix
  - platform: resampler
    id: media_spk
    output_speaker: media_mix

media_player:
  - platform: speaker
    id: ghost_player
    name: Speaker
    volume_initial: 0.7
    announcement_pipeline:
      speaker: announce_spk
      format: FLAC
      sample_rate: 16000
      num_channels: 1
    media_pipeline:
      speaker: media_spk
      format: FLAC
      sample_rate: 16000
      num_channels: 1

# ── wake word + voice assistant ──────────────────────────────────────────────
micro_wake_word:
  id: mww
  microphone:
    microphone: va_mic
    gain_factor: 4
  vad:
  models:
    - model: ${wake_word}
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: mute
        then:
          - light.turn_on: {id: backlight, brightness: 80%}
          - voice_assistant.start:
              wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: va_mic
  media_player: ghost_player
  micro_wake_word: mww
  noise_suppression_level: 2
  auto_gain: 31dBFS
  volume_multiplier: 2.0
  on_listening:
    - script.execute: {id: show_phase, phase: "listening"}
  on_stt_vad_end:
    - script.execute: {id: show_phase, phase: "thinking"}
  on_stt_end:
    - lvgl.label.update: {id: heard, text: !lambda 'return x;'}
  on_tts_start:
    - script.execute: {id: show_phase, phase: "speaking"}
    - lvgl.label.update: {id: heard, text: !lambda 'return x;'}
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - script.execute: {id: show_phase, phase: "idle"}
  on_error:
    - script.execute: {id: show_phase, phase: "error"}
    - delay: 3s
    - script.execute: {id: show_phase, phase: "idle"}

binary_sensor:
  - platform: gpio            # side PWR key: press to talk / stop
    id: talk_key
    name: Talk button
    pin: {pca9554: exp, number: 4, inverted: true}
    on_press:
      - if:
          condition: voice_assistant.is_running
          then:
            - voice_assistant.stop:
          else:
            - if:
                condition: {switch.is_off: mute}
                then:
                  - voice_assistant.start:
  - platform: gpio            # side BOOT key: mute / unmute the microphone
    id: mute_key
    pin: {number: GPIO0, inverted: true, mode: INPUT_PULLUP}
    on_press:
      - switch.toggle: mute

# ── Home Assistant data for the screen ───────────────────────────────────────
sensor:
  - platform: homeassistant
    id: outside_temp
    entity_id: ${weather_entity}
    attribute: temperature
    on_value:
      - lvgl.label.update:
          id: weather_lbl
          text: !lambda |-
            return str_sprintf("%.0f°  %s", x, id(weather_state).state.c_str());

text_sensor:
  - platform: homeassistant
    id: weather_state
    entity_id: ${weather_entity}
  - platform: homeassistant
    id: l1_state
    entity_id: ${light_1}
    on_value:
      - lvgl.widget.update: {id: btn1, state: {checked: !lambda 'return x == "on";'}}
  - platform: homeassistant
    id: l2_state
    entity_id: ${light_2}
    on_value:
      - lvgl.widget.update: {id: btn2, state: {checked: !lambda 'return x == "on";'}}
  - platform: homeassistant
    id: l3_state
    entity_id: ${light_3}
    on_value:
      - lvgl.widget.update: {id: btn3, state: {checked: !lambda 'return x == "on";'}}

# ── the screen layout ────────────────────────────────────────────────────────
script:
  - id: show_phase
    parameters:
      phase: std::string
    then:
      - lambda: |-
          struct P { const char *name; uint32_t ring; uint32_t core; const char *text; };
          static const P table[] = {
            {"idle",      0x1E2A36, 0x7FD8FF, "Say \"${wake_word_name}\""},
            {"listening", 0x0E5C7A, 0x9FE8FF, "Listening..."},
            {"thinking",  0x3B2A66, 0xB79CFF, "Thinking..."},
            {"speaking",  0x115E45, 0x7CFFC4, ""},
            {"muted",     0x4A1C1C, 0xFF7A7A, "Microphone off"},
            {"error",     0x5A3A10, 0xFFB454, "Couldn't reach Ghost"},
          };
          const P *p = &table[0];
          for (auto &e : table) if (phase == e.name) p = &e;
          lv_obj_set_style_bg_color(id(ghost_ring), lv_color_hex(p->ring), 0);
          lv_obj_set_style_bg_color(id(ghost_core), lv_color_hex(p->core), 0);
          lv_obj_set_style_shadow_color(id(ghost_core), lv_color_hex(p->core), 0);
          if (p->text[0]) lv_label_set_text(id(status_lbl), p->text);
          else lv_label_set_text(id(status_lbl), "");
          if (phase == "idle" || phase == "muted") lv_label_set_text(id(heard), "");

interval:
  - interval: 10s
    then:
      - lvgl.label.update:
          id: clock_lbl
          text: !lambda 'auto t = id(ha_time).now(); return t.is_valid() ? t.strftime("%H:%M") : std::string("--:--");'
      - lvgl.label.update:
          id: date_lbl
          text: !lambda 'auto t = id(ha_time).now(); return t.is_valid() ? t.strftime("%A %d %B") : std::string("");'

lvgl:
  displays: [screen]
  touchscreens: [touch]
  buffer_size: 25%
  color_depth: 16
  on_idle:
    - timeout: 90s
      then:
        - light.turn_on: {id: backlight, brightness: 15%}
  style_definitions:
    - id: tile
      bg_color: 0x111821
      bg_opa: COVER
      radius: 18
      border_width: 0
      text_color: 0xC9D6E2
      text_font: montserrat_20
    - id: tile_on
      bg_color: 0x1F4E66
      text_color: 0xFFFFFF
  pages:
    - id: main_page
      bg_color: 0x080C11
      widgets:
        - label:
            id: clock_lbl
            align: TOP_MID
            y: 18
            text: "--:--"
            text_font: montserrat_48
            text_color: 0xEAF2FA
        - label:
            id: date_lbl
            align: TOP_MID
            y: 78
            text: ""
            text_font: montserrat_18
            text_color: 0x7D8A97
        - label:
            id: weather_lbl
            align: TOP_MID
            y: 104
            text: ""
            text_font: montserrat_18
            text_color: 0x9FB3C4
        - obj:                 # the Ghost "presence": a soft ring with a glowing core
            id: ghost_ring
            align: CENTER
            y: -6
            width: 150
            height: 150
            radius: 75
            bg_color: 0x1E2A36
            border_width: 0
            scrollable: false
            clickable: true
            on_click:
              - if:
                  condition: voice_assistant.is_running
                  then: [voice_assistant.stop]
                  else:
                    - if:
                        condition: {switch.is_off: mute}
                        then: [voice_assistant.start]
            widgets:
              - obj:
                  id: ghost_core
                  align: CENTER
                  width: 74
                  height: 74
                  radius: 37
                  bg_color: 0x7FD8FF
                  border_width: 0
                  shadow_width: 40
                  shadow_spread: 6
                  shadow_color: 0x7FD8FF
                  clickable: false
        - label:
            id: status_lbl
            align: CENTER
            y: 86
            text: "Say \"${wake_word_name}\""
            text_font: montserrat_18
            text_color: 0x9FB3C4
        - label:
            id: heard
            align: CENTER
            y: 116
            width: 440
            long_mode: DOT
            text_align: CENTER
            text: ""
            text_font: montserrat_16
            text_color: 0x6F7F8E
        - obj:
            align: BOTTOM_MID
            y: -14
            width: 456
            height: 96
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            layout:
              type: FLEX
              flex_flow: ROW
              flex_align_main: SPACE_EVENLY
              flex_align_cross: CENTER
            widgets:
              - button:
                  id: btn1
                  styles: tile
                  width: 140
                  height: 84
                  checkable: true
                  checked: {styles: tile_on}
                  widgets:
                    - label: {align: CENTER, text: "${light_1_name}"}
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data: {entity_id: "${light_1}"}
              - button:
                  id: btn2
                  styles: tile
                  width: 140
                  height: 84
                  checkable: true
                  checked: {styles: tile_on}
                  widgets:
                    - label: {align: CENTER, text: "${light_2_name}"}
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data: {entity_id: "${light_2}"}
              - button:
                  id: btn3
                  styles: tile
                  width: 140
                  height: 84
                  checkable: true
                  checked: {styles: tile_on}
                  widgets:
                    - label: {align: CENTER, text: "${light_3_name}"}
                  on_short_click:
                    - homeassistant.action:
                        action: homeassistant.toggle
                        data: {entity_id: "${light_3}"}
