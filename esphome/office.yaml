# Ghost room screen: Office. Change the entity ids below to match your Home Assistant,
# then flash with the ESPHome add-on (Install → plug into this computer the first time).
substitutions:
  name: ghost-office
  friendly_name: Office Screen
  room: Office
  wake_word: hey_jarvis
  wake_word_name: Hey Jarvis
  weather_entity: weather.home
  light_1: light.office_light
  light_1_name: Light
  light_2: light.office_lamp
  light_2_name: Lamp
  light_3: fan.office_fan
  light_3_name: Fan

packages:
  base: !include ghost-room-base.yaml

api:
  encryption:
    key: !secret office_api_key
